name: Android Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.DESK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DESK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DESK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DESK_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/desk-companion-release.jks

          cat > keystore.properties <<EOF
          storeFile=desk-companion-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: |
          VERSION="${GITHUB_REF_NAME}"
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "No APK found."
            exit 1
          fi

          cp "$APK" \
             "app/build/outputs/apk/release/DESK-Companion-${VERSION}.apk"

          echo "APK found: $APK"

      - name: Verify APK signature
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name "*.apk" ! -name "DESK-Companion-*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "No APK found for signature verification."
            exit 1
          fi

          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload \
            "${GITHUB_REF_NAME}" \
            "app/build/outputs/apk/release/DESK-Companion-${GITHUB_REF_NAME}.apk" \
            --clobber
